run_id: galbot_bimanual_qwengroot
run_root_dir: playground/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: 2645773389-harbin-institute-of-technology
wandb_project: starVLA_galbot
is_debug: false

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /mnt/home/liuyi/models/starVLA/Pretrained_models/Qwen3.5-2B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048  # Qwen3.5-2B hidden_dim is 2048
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 20
    state_dim: 9
    future_action_window_size: 29
    action_horizon: 30
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  obs_image_size: [224, 224]

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /path/to/your/lerobot/root
    data_mix: galbot_bimanual_self_mix
    include_state: true
    # Action chunk representation. CLI/run script should keep this consistent with the stats file.
    # abs: world-frame action, delta: frame-to-frame local delta, relative_pose: local offset to chunk[0]
    action_mode: delta
    action_chunk_size: 30
    # For this Galbot finetuning task, keep gripper raw through stats/normalization,
    # then apply threshold binarization with BinaryGripperTransform in data_config.py.
    gripper_normalization: binary_independent
    gripper_binary_threshold: 100.0
    default_image_resolution: [224, 224, 3]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["video.left_wrist", "video.right_wrist"]
    image_size: [224, 224]
    video_backend: torchvision_av

trainer:
  epochs: 100
  max_train_steps: 80000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  save_format: pt
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true